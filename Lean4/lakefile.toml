name = "Leibniz"
defaultTargets = ["Math"]
# defaultTargets = ["leibniz"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.verso.code.warnLineLength = 100

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "verso"
scope = "leanprover"
# rev = "main"
rev = "v4.33.0"

[[lean_lib]]
name = "Combinator"

[[lean_lib]]
name = "Math"

[[lean_lib]]
name = "Misc"

[[lean_lib]]
name = "Program"

[[lean_lib]]
name = "old"

[[lean_exe]]
name = "leibniz"
root = "Main"

[[lean_lib]]
name = "Journal"

[[lean_exe]]
name = "journal"
root = "GenerateJournal"
